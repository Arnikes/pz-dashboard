name: CI and deployment

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Code and browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Development dependencies and Chromium
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install -r requirements-dev.txt
          ./.venv/bin/python -m playwright install --with-deps chromium

      - name: Run quality checks
        run: ./.venv/bin/python scripts/check.py

  image:
    name: Image build, smoke test, and optional publication
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build panel image
        run: |
          # A private image ID avoids tag races on shared Docker daemons.
          image_dir=$(mktemp -d "$RUNNER_TEMP/pz-console-image.XXXXXX")
          trap 'rm -f "$image_dir/panel-image.id"; rmdir "$image_dir"' EXIT
          docker build --iidfile "$image_dir/panel-image.id" ./dashboard
          echo "PANEL_IMAGE_ID=$(cat "$image_dir/panel-image.id")" >> "$GITHUB_ENV"

      - name: Check container startup
        run: python scripts/smoke_image.py "$PANEL_IMAGE_ID"

      - name: Publish the tested image to Gitea registry
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))))
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::Set the REGISTRY_TOKEN secret (scope: write:package)."
            exit 1
          fi
          registry="${GITHUB_SERVER_URL#http://}"
          registry="${registry#https://}"
          image="$registry/${GITHUB_REPOSITORY,,}"
          sha_tag="$image:sha-${GITHUB_SHA:0:7}"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$registry" -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$PANEL_IMAGE_ID" "$image:latest"
          docker tag "$PANEL_IMAGE_ID" "$sha_tag"
          docker push "$image:latest"
          docker push "$sha_tag"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            docker tag "$PANEL_IMAGE_ID" "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
          fi

      - name: Log out of Gitea registry
        if: >-
          always() &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))))
        run: |
          registry="${GITHUB_SERVER_URL#http://}"
          registry="${registry#https://}"
          docker logout "$registry"

  deploy:
    name: SSH deployment (optional)
    runs-on: ubuntu-latest
    needs: image
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))))
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose pull pz-dashboard && docker compose up -d pz-dashboard && docker image prune -f"
