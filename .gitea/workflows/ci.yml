name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Development dependencies and Chromium
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install -r requirements-dev.txt
          ./.venv/bin/python -m playwright install --with-deps chromium

      - name: Run quality checks
        run: ./.venv/bin/python scripts/check.py

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t pz-pult:ci ./dashboard

      - name: Container startup and /api/health
        run: |
          # act_runner jobs normally run in containers sharing docker.sock.
          # Published ports bind to the daemon host and may not be reachable
          # on job-local loopback. Check health through the Docker network
          # using the container name (Docker DNS).
          docker network create pz-smoke
          auth_key=$(docker run --rm pz-pult:ci python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          docker run -d --name pz-pult-smoke --network pz-smoke \
            -e PZ_ADMIN_LOGIN=ci-admin -e PZ_ADMIN_PASSWORD=ci-only-dummy-password \
            -e PZ_AUTH_KEY="$auth_key" \
            -e RCON_PASSWORD=ci-dummy -e PZ_SERVER_NAME=ci pz-pult:ci
          for i in $(seq 1 30); do
            if docker run --rm --network pz-smoke pz-pult:ci python3 -c "import urllib.request; urllib.request.urlopen('http://pz-pult-smoke:8080/api/health', timeout=4)" 2>/dev/null; then
              echo "health OK (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "health did not respond within 30 seconds"
          exit 1

      - name: Cleanup and diagnostics
        if: always()
        run: |
          docker logs pz-pult-smoke || true
          docker rm -f pz-pult-smoke || true
          docker network rm pz-smoke || true
