name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Проверки кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python — компиляция всех модулей
        run: python3 -m compileall -q dashboard

      - name: Python — юнит-тесты
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet pytest
          ./.venv/bin/pytest -q tests

      - name: JS — синтаксис интерфейса
        run: node --check dashboard/static/app.js

  image:
    name: Сборка образа и smoke-запуск
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t pz-pult:ci ./dashboard

      - name: Smoke — контейнер стартует и отвечает /api/health
        run: |
          docker run -d --name pz-pult-smoke -p 18080:8080 \
            -e RCON_PASSWORD=ci-dummy -e PZ_SERVER_NAME=ci pz-pult:ci
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/api/health; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "--- логи контейнера ---"
            docker logs pz-pult-smoke
            exit 1
          fi

      - name: Уборка
        if: always()
        run: docker rm -f pz-pult-smoke || true
