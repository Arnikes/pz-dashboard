name: CD

# Publish the image to the Gitea registry:
#   - each push to main (latest and sha-<commit> tags);
#   - v* tags (also a version tag);
#   - manually (workflow_dispatch).
# Optional SSH deployment requires DEPLOY_ENABLED=true.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Publish image to Gitea registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      - name: Log in to Gitea Container Registry
        run: |
          if [ -z "${{ secrets.REGISTRY_TOKEN }}" ]; then
            echo "::error::Set the REGISTRY_TOKEN secret (scope: write:package)."
            exit 1
          fi
          # Log in as the pushing actor with a token as password.
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${GITHUB_SERVER_URL#https://}" -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          REGISTRY="${GITHUB_SERVER_URL}"
          REGISTRY="${REGISTRY#http://}"; REGISTRY="${REGISTRY#https://}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="$REGISTRY/$REPO_LOWER"
          SHA_TAG="$IMAGE:sha-$(echo "${GITHUB_SHA:0:7}")"
          echo "Publishing: $IMAGE:latest and $SHA_TAG"
          docker build -t "$IMAGE:latest" -t "$SHA_TAG" ./dashboard
          docker push "$IMAGE:latest"
          docker push "$SHA_TAG"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker tag "$IMAGE:latest" "$IMAGE:${{ github.ref_name }}"
            docker push "$IMAGE:${{ github.ref_name }}"
          fi

  deploy:
    name: SSH deployment (optional)
    runs-on: ubuntu-latest
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd '${{ vars.DEPLOY_PATH }}' && docker compose pull pz-dashboard && docker compose up -d pz-dashboard && docker image prune -f"
