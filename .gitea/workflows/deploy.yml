name: CD

# Публикация образа в реестр Gitea — на тег v* или вручную.
# Опциональный SSH-деплой включается переменной DEPLOY_ENABLED=true.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Публикация образа в реестр Gitea
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Логин, сборка и push
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          # реестр Gitea = адрес самого Gitea
          REGISTRY="${{ github.server_url }}"
          REGISTRY="${REGISTRY#http://}"; REGISTRY="${REGISTRY#https://}"
          # в реестре имена только в нижнем регистре
          IMAGE=$(echo "$REGISTRY/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Публикую образ: $IMAGE"
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.ref_name }}" ./dashboard
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.ref_name }}"

  deploy:
    name: SSH-деплой на сервер (опционально)
    runs-on: ubuntu-latest
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Деплой по SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd '${{ vars.DEPLOY_PATH }}' && docker compose pull pz-dashboard && docker compose up -d pz-dashboard && docker image prune -f"
