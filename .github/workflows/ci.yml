name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Code and browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run quality checks
        run: python scripts/check.py
      - name: Retain browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Docker build and health check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build panel image
        run: docker build -t pz-console:ci ./dashboard
      - name: Check container startup
        run: |
          auth_key=$(docker run --rm pz-console:ci python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          docker run -d --name pz-console-smoke \
            -e PZ_ADMIN_LOGIN=ci-admin \
            -e PZ_ADMIN_PASSWORD=ci-only-dummy-password \
            -e PZ_AUTH_KEY="$auth_key" \
            -e RCON_PASSWORD=ci-only-dummy pz-console:ci
          for attempt in $(seq 1 30); do
            if docker exec pz-console-smoke python healthcheck.py; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs pz-console-smoke || true
          docker rm -f pz-console-smoke || true
