<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PZ Пульт" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <title>Вход · PZ Пульт</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/fonts/fonts.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/pwa.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <a class="login-github" href="https://github.com/Arnikes/pz-dashboard" target="_blank" rel="noopener noreferrer" aria-label="Проект на GitHub (откроется в новой вкладке)" title="Проект на GitHub (откроется в новой вкладке)">
      <svg class="login-github-art" viewBox="0 0 88 88" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="github-fold" x1="14" y1="66" x2="51" y2="28" gradientUnits="userSpaceOnUse">
            <stop stop-color="var(--surface-3)" />
            <stop offset=".5" stop-color="var(--line-strong)" />
            <stop offset=".86" stop-color="var(--muted)" />
            <stop offset="1" stop-color="var(--ink)" />
          </linearGradient>
        </defs>
        <path class="login-github-reveal" d="M0 0H76Q88 0 88 12V88Z" />
        <g class="login-github-logo">
          <svg x="49" y="9" width="31" height="31" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
          </svg>
        </g>
        <g class="login-github-fold">
          <path d="M0 0C18 10 31 25 42 43C59 54 73 73 88 88C66 77 45 68 22 66C25 42 12 19 0 0Z" fill="url(#github-fold)" />
          <path d="M0 0C18 10 31 25 42 43C59 54 73 73 88 88" fill="none" stroke="var(--ink)" stroke-opacity=".4" stroke-width=".75" />
        </g>
      </svg>
    </a>
    <h1 class="login-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a8 8 0 0 0-8 8c0 3 1.6 5.4 4 6.8V20a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3.2c2.4-1.4 4-3.8 4-6.8a8 8 0 0 0-8-8Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10.5" r="1.6" fill="currentColor"/><circle cx="15" cy="10.5" r="1.6" fill="currentColor"/><path d="M10.5 15.5h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="brand-name">PZ·ПУЛЬТ</span>
    </h1>
    <select class="language-switch" data-language-switch aria-label="Язык интерфейса"><option value="en" lang="en">EN</option><option value="ru" lang="ru">RU</option></select>
    <p id="languageStatus" class="login-error" role="alert" hidden></p>
    <form id="loginForm">
      <label for="login">Логин</label>
      <input id="login" name="username" type="text" autocomplete="username" maxlength="128" required autofocus />
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required />
      <label class="login-remember" for="remember">
        <input id="remember" name="remember" type="checkbox" aria-describedby="rememberHint" />
        <span>Запомнить меня</span>
      </label>
      <p id="rememberHint" class="login-hint">Сохранить вход на этом устройстве на 30 дней.</p>
      <p id="loginError" class="login-error" role="alert" hidden></p>
      <button id="loginSubmit" class="btn" type="submit">Войти</button>
    </form>
  </main>
  <script src="/static/catalogs.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/localize.js"></script>
  <script src="/static/login.js"></script>
  <script src="/static/pwa.js"></script>
</body>
</html>
