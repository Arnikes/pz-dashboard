[tool.ruff]
target-version = "py312"
line-length = 100
include = ["dashboard/*.py", "tests/**/*.py", "scripts/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["browser: browser tests using isolated HTTP fixtures"]
